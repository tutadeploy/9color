<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible " content="IE=edge" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>在 线 咨 询</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0
        }
    </style>
</head>

<body>
    <!-- 使用官方推荐的defer属性，优化页面加载性能 -->
    <script>
        (function(d, s, id, w, n) {
            w.__ssc = w.__ssc || {};
            w.__ssc.license = 'guwjer';
            if (w.ssq) return false;
            n = w.ssq = function() {n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
            n.push=n;n.loaded=!0;n.queue=[];
            var js, sjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s); 
            js.id = id;
            
            // 按照官方文档推荐，使用defer属性优化加载
            js.defer = true;
            
            var deUrl = atob('aHR0cHM6Ly9wbHVnaW4tY29kZS5zYWxlc21hcnRseS5jb20='), path = '/chat/widget/code/install.js';
            var cs = d.currentScript, csUrl = deUrl;
            if (cs && cs.src) {var scriptURL = new URL(cs.src); csUrl = scriptURL.origin;}
            js.src = csUrl + path;
            
            sjs.parentNode.insertBefore(js, sjs);
            js.onerror = function() {
                if (d.getElementById(id)) {var el = d.getElementById(id); el.parentNode.removeChild(el);}
                var newJs = d.createElement(s); newJs.id = id;
                newJs.defer = true;  // 备用脚本也使用defer
                newJs.src = deUrl + path;
                sjs.parentNode.insertBefore(newJs, sjs);
            }
        }(document, 'script', 'ss-chat', window));
    </script>

    <!-- 设置用户登录信息 -->
    <script>
        // 等待SalesSmartly插件加载完成后设置用户信息
        window.addEventListener('load', function() {
            // 检查ssq是否已加载
            if (window.ssq) {
                // 监听插件资源加载完成
                ssq.push('onReady', function() {
                    // 获取当前用户信息
                    getCurrentUserInfo().then(function(currentUser) {
                        if (currentUser && currentUser.user_id) {
                            // 设置用户登录信息
                            ssq.push('setLoginInfo', {
                                user_id: 'user_' + currentUser.user_id,     // 加密后的用户id, 必填！
                                user_name: currentUser.username,            // 用户名
                                language: 'zh-CN',                          // 设置为中文
                                phone: currentUser.tel,                     // 用户手机号
                                description: '9Color平台用户',               // 简单描述
                                label_names: ['9Color用户']                  // 简单标签
                            });
                            
                            console.log('用户信息已设置到SalesSmartly客服系统:', currentUser.username);
                        } else {
                            console.log('未获取到用户信息，用户可能未登录');
                        }
                    }).catch(function(error) {
                        console.warn('获取用户信息失败:', error);
                    });
                });
            }
        });

        // 获取当前用户信息的函数（基于9Color项目的实际结构）
        function getCurrentUserInfo() {
            return new Promise(function(resolve, reject) {
                // 方法1: 通过AJAX从后端获取当前用户信息
                fetch('/index/api/getCurrentUser', {
                    method: 'GET',
                    credentials: 'include' // 包含session cookie
                })
                .then(function(response) {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('获取用户信息失败');
                })
                .then(function(data) {
                    if (data.code === 0 && data.data) {
                        resolve(data.data);
                    } else {
                        throw new Error(data.info || '用户未登录');
                    }
                })
                .catch(function(error) {
                    console.log('AJAX获取用户信息失败，尝试其他方式:', error.message);
                    
                    // 方法2: 从页面中的用户信息变量获取（如果有的话）
                    if (typeof window.userInfo !== 'undefined' && window.userInfo) {
                        resolve(window.userInfo);
                        return;
                    }
                    
                    // 方法3: 从localStorage获取缓存的用户信息
                    var cachedUserInfo = localStorage.getItem('9color_user_info');
                    if (cachedUserInfo) {
                        try {
                            var userInfo = JSON.parse(cachedUserInfo);
                            resolve(userInfo);
                            return;
                        } catch (e) {
                            console.warn('解析缓存用户信息失败:', e);
                        }
                    }
                    
                    // 方法4: 从cookie获取用户信息
                    var userId = getCookie('user_id');
                    var userTel = getCookie('tel');
                    
                    if (userId || userTel) {
                        resolve({
                            user_id: userId || 'unknown',
                            username: userTel || '用户',
                            tel: userTel
                        });
                        return;
                    }
                    
                    // 如果所有方法都失败，返回null
                    resolve(null);
                });
            });
        }



        // 获取Cookie的辅助函数
        function getCookie(name) {
            var value = "; " + document.cookie;
            var parts = value.split("; " + name + "=");
            if (parts.length == 2) return parts.pop().split(";").shift();
            return null;
        }

        // 用户退出登录时清理信息
        function clearUserInfo() {
            if (window.ssq) {
                ssq.push('clearUser');
                console.log('用户信息已清理');
            }
            // 清理本地缓存
            localStorage.removeItem('9color_user_info');
        }

        // 手动打开客服聊天（可选）
        function openCustomerService() {
            if (window.ssq) {
                ssq.push('chatOpen');
            }
        }

        // 监听页面卸载，清理用户信息（如果需要）
        window.addEventListener('beforeunload', function() {
            // 这里可以根据需要决定是否清理用户信息
            // clearUserInfo();
        });
    </script>
</body>

</html>
